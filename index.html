<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de perfil GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Busca de perfil GitHub</h1>

    <form id="form-buscar" class="form">
        <input id="campo-buscar" type="text" placeholder="Insira o nome do usuário" autocomplete="off" required>
        <button type="submit">Buscar</button>
    </form>

    <p id="status"></p>
    <div id="perfil"></div>
    <ul id="repos"></ul>
    
    <script src="script.js"></script>
</body>
</html>
